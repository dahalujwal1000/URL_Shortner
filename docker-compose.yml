version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./database:/app/../database
      - ./backend/.env:/app/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_PATH=/app/../database/urls.db
      - BASE_URL=http://localhost:5000
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
      target: production
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    restart: unless-stopped
